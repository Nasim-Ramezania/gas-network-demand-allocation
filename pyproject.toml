[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-network-demand-allocation"
version = "0.1.0"
description = "Allocate GIS consumer demand to gas-network endpoints with conservation checks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "geopandas==1.2.0",
  "pandas==2.2.3",
  "shapely==2.2.0",
  "pyogrio==0.13.0",
  "pyproj==3.8.0",
  "numpy==2.3.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gas-network = "gas_network.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
