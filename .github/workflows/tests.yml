name: Tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[test]"

      - run: python -m pytest -q

      - run: python -m gas_network --lines data/example/sample_pipes.geojson --consumers data/example/sample_consumers.geojson --output output/nodes_with_load.shp
